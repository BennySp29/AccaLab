name: AccaLab Scheduled Data & Model Sync

on:
  schedule:
    # Runs every 6 hours (06:00, 12:00, 18:00, 00:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-and-predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: pip install flask httpx beautifulsoup4 google-genai pydantic python-dotenv

      - name: Run AccaLab ingestion, modelling & alert check
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DEFAULT_CHAT_ID: ${{ secrets.TELEGRAM_DEFAULT_CHAT_ID }}
        run: python run.py sync --no-backtest
