name: AccaLab Scheduled Data & Model Sync

on:
  schedule:
    # Runs at 00:00, 07:00, 11:00, and 17:00 UTC (morning racecards, midday refresh & matchdays)
    - cron: '0 0,7,11,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Run AccaLab ingestion, modelling & static snapshot export
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DEFAULT_CHAT_ID: ${{ secrets.TELEGRAM_DEFAULT_CHAT_ID }}
        run: |
          python run.py sync --no-backtest
          python run.py export-static

      - name: Commit and push updated static snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/snapshot.json accalab/static/snapshot.json static/racing_snapshot.json accalab/static/racing_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh live AccaLab snapshot"
            git push
          fi
